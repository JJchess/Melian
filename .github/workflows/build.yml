name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable --no-self-update
      - name: Build and test
        shell: pwsh
        run: ./rust/build.ps1
      - name: Name release asset
        shell: pwsh
        run: Copy-Item rust/dist/Melian.Setup.exe rust/dist/Melian-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: rust/dist/Melian-windows-x64.exe
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable --no-self-update
      - name: Build, test and render AppKit UI
        run: bash rust/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            rust/dist/Melian-macos-*.tar.gz
            rust/dist/macos-preview-*.png
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum Melian-windows-x64.exe Melian-macos-arm64.tar.gz Melian-macos-x64.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Melian $RELEASE_TAG" --notes-file ../docs/RELEASE.md Melian-windows-x64.exe Melian-macos-arm64.tar.gz Melian-macos-x64.tar.gz SHA256SUMS.txt LICENSE
