<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude 网络守卫</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
  <header><span class="brand-dot"></span><strong>CLAUDE GUARD</strong><span class="tag" id="browser">浏览器</span></header>
  <p class="eyebrow">保护状态</p><h1 id="status">正在连接</h1>
  <p class="reason" id="reason">正在读取桌面守卫状态…</p>
  <dl><div><dt>节点</dt><dd id="node">—</dd></div><div><dt>代理 IP 属地</dt><dd id="country">—</dd></div><div><dt>上次验证</dt><dd id="verifiedAt">—</dd></div></dl>
  <div class="actions"><button id="recheck" class="primary">重新检查</button><button id="switchPreferred">切换首选美国节点</button><button id="openClaude">打开 Claude 网页</button></div>
  <p id="feedback" role="status"></p><a href="install.html" target="_blank">安装、冲突排查与卸载</a>
  <p class="footnote">仅当前已安装扩展的浏览器配置受保护。</p>
</main><script type="module" src="ui.mjs"></script></body></html>
