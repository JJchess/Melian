  <header><span class="brand-dot"></span><strong>MELIAN</strong><span class="tag">网页保护</span></header>
  <h1>网页保护暂时停用</h1>
  <p>正在修复关闭 VPN 后可能影响校园网等其他网站的问题。自动接入入口已关闭，浏览器原有账号和登录资料会保留。</p>
  <p>目前无需安装扩展、创建新浏览器配置或重新登录。修复并完成网络切换验证后，再恢复接入。</p>
  <h3>已有旧版扩展</h3>
  <p>若你曾手动安装旧版扩展，可在 Edge 或 Chrome 的扩展管理页禁用或移除 Melian（旧名 Claude 网络守卫）。它不作为本次网络兼容问题的已验证修复方案。</p>
  <p class="footnote">绿色胶囊只表示网络检查通过；网页入口的接入情况单独显示。</p>
</main>
