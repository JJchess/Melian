[workspace]
members = ["crates/protocol", "crates/core", "crates/platform", "crates/desktop", "crates/cli", "crates/setup"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
  "implement", "Foundation_Numerics", "Foundation_Collections", "ApplicationModel", "Management_Deployment", "Storage",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_TaskScheduler",
  "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Power",
  "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition",
  "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Console"
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
guard-protocol = { path = "crates/protocol" }
guard-core = { path = "crates/core" }
guard-platform = { path = "crates/platform" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

