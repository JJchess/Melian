<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Melian — 平时安静，异常看得见</title>
  <desc id="description">深色背景上的 Melian 胶囊示意：绿色状态点表示网络检查通过；红色状态点与连接受阻文字提示异常。图示为 README 绘制，并非实机截图。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#171e1e"/>
      <stop offset="0.6" stop-color="#111617"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#335349" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#335349" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line">
      <stop stop-color="#83d7b0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#83d7b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-70%" width="160%" height="260%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#background)"/>
  <ellipse cx="920" cy="130" rx="410" ry="320" fill="url(#light)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="70" y="82" fill="#a4b7ad" font-size="14" letter-spacing="5">MELIAN / WINDOWS</text>
    <text x="68" y="187" fill="#f0f3f0" font-size="48" font-weight="600">平时安静，</text>
    <text x="68" y="255" fill="#f0f3f0" font-size="48" font-weight="600">异常看得见。</text>
    <text x="71" y="315" fill="#a6b0ab" font-size="19">把网络检查，留给桌面上的小胶囊。</text>
    <path d="M72 361H480" stroke="url(#line)"/>
    <text x="71" y="402" fill="#99aaa1" font-size="14" letter-spacing="1">CLAUDE DESKTOP · CLAUDE CODE</text>
    <text x="746" y="108" fill="#9eb2a7" font-size="13" letter-spacing="3">READY</text>
    <g filter="url(#shadow)">
      <rect x="744" y="128" width="264" height="68" rx="34" fill="#090b0c" stroke="#414a45"/>
      <circle cx="796" cy="162" r="7" fill="#83d7b0"/>
      <text x="821" y="172" fill="#f0f2f0" font-size="27" font-weight="600">Melian</text>
    </g>
    <path d="M876 216V253" stroke="#688073" stroke-opacity="0.4" stroke-dasharray="3 6"/>
    <text x="686" y="280" fill="#bd9d9a" font-size="13" letter-spacing="3">CONNECTION BLOCKED</text>
    <g filter="url(#shadow)">
      <rect x="684" y="300" width="384" height="68" rx="34" fill="#180e10" stroke="#a5595c" stroke-opacity="0.8"/>
      <circle cx="724" cy="334" r="7" fill="#f28e90"/>
      <text x="748" y="343" fill="#f3d6d5" font-size="24" font-weight="600">Melian · 连接受阻</text>
    </g>
    <text x="876" y="419" text-anchor="middle" fill="#86938c" font-size="13">状态示意 · 绿色仅表示网络检查通过</text>
  </g>
</svg>
